name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1: Lint and Test
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers Pillow matplotlib numpy pandas nltk evaluate rouge-score
          pip install fastapi uvicorn python-multipart

      - name: Run black (code formatting check)
        run: black --check --diff src/ app/ tests/ scripts/ || true

      - name: Run flake8 (linting)
        run: flake8 src/ app/ --max-line-length=120 --ignore=E501,W503,E402 || true

      - name: Run pytest
        run: pytest tests/test_pipeline.py -v -m "not slow" --tb=short || true

  # 2: Docker Build (only on merge to main)
  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t blip-captioning-api .

      - name: Verify Docker image
        run: docker images blip-captioning-api